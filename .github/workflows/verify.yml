name: Exact symbolic checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned symbolic dependencies
        run: python -m pip install -r requirements.txt
      - name: Check the runner
        run: python -m unittest discover -s tests -v
      - name: Run every exact check, including residual classification
        run: python run_checks.py --include-slow --jobs 2 --timeout 1800
